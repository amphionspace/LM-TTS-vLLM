# Initial native pipeline validation, not the final performance profile.
model_runner: v2
async_chunk: false
connectors:
  codec_transfer:
    name: SharedMemoryConnector
    extra:
      codec_streaming: false
stages:
  - stage_id: 0
    devices: "0"
    dtype: bfloat16
    max_num_seqs: 1
    max_model_len: 4096
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.08
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: false
    attention_backend: FLASH_ATTN
    default_sampling_params:
      temperature: 0.0
      repetition_penalty: 1.05
      max_tokens: 80
      min_tokens: 2
    subtalker_sampling_params:
      do_sample: false
    silence_ban_frames: 0
    output_connectors:
      to_stage_1: codec_transfer
  - stage_id: 1
    hf_overrides:
      model_type: lm_tts
    devices: "0"
    dtype: bfloat16
    max_num_seqs: 1
    max_model_len: 8192
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.08
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: false
    input_connectors:
      from_stage_0: codec_transfer
    default_sampling_params:
      temperature: 0.0
      max_tokens: 8192
      repetition_penalty: 1.0
