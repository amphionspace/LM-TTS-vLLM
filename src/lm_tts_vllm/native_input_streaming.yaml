# Native resumable text input: flush each 10-frame text/audio unit.
model_runner: v2
async_chunk: true
connectors:
  codec_transfer:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      codec_chunk_frames: 10
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 10
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
stages:
  - stage_id: 0
    devices: "0"
    dtype: bfloat16
    max_num_seqs: 32
    max_model_len: 4096
    max_num_batched_tokens: 4096
    # ~112 KB per token: 4 GiB holds ~37k tokens, so 32 long streams never preempt (a preempted stream is truncated).
    kv_cache_memory_bytes: 4294967296
    enforce_eager: false
    # Decode steps replay one full graph; streamed-text prefills use piecewise graphs.
    compilation_config:
      mode: 3
      cudagraph_mode: FULL_AND_PIECEWISE
    enable_prefix_caching: false
    async_scheduling: false
    attention_backend: FLASH_ATTN
    default_sampling_params:
      temperature: 0.0
      repetition_penalty: 1.05
      max_tokens: 80
      min_tokens: 2
    subtalker_sampling_params:
      do_sample: false
    silence_ban_frames: 0
    output_connectors:
      to_stage_1: codec_transfer
  - stage_id: 1
    model_runner: v1
    hf_overrides:
      model_type: lm_tts
    devices: "0"
    dtype: bfloat16
    max_num_seqs: 32
    max_model_len: 8192
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.08
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: false
    input_connectors:
      from_stage_0: codec_transfer
    default_sampling_params:
      temperature: 0.0
      max_tokens: 8192
      repetition_penalty: 1.0
