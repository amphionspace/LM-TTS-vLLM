[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-tts-vllm"
version = "0.1.0"
description = "Qwen3-TTS model plugin for vLLM 0.32.0"
requires-python = ">=3.11"

[project.optional-dependencies]
omni = ["vllm==0.32.0", "vllm-omni @ git+https://github.com/vllm-project/vllm-omni.git@ee37ec0620a99b3787dab5e5e3bd1f5cdfd0615f"]

[project.entry-points."vllm.general_plugins"]
lm_tts = "lm_tts_vllm:register"

[project.entry-points."vllm_omni.general_plugins"]
lm_tts = "lm_tts_vllm.omni:register"

[tool.setuptools.package-data]
lm_tts_vllm = ["*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lm_tts_vllm*"]
