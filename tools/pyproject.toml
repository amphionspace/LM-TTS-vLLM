[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-tts-vllm-tools"
version = "0.1.0"
description = "Development, inference comparison and UltraEval tools for LM-TTS-vLLM"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["lm_tts_tools*"]
